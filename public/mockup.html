<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Device Mockup Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        /* Android Phone Frame */
        .android-phone {
            width: 440px;
            height: 940px;
            background: #18181b;
            border-radius: 50px;
            padding: 12px 14px 16px 14px;
            box-shadow: 
                0 0 0 2px #27272a,
                0 25px 50px -12px rgba(0, 0, 0, 0.35),
                8px 8px 0px #000000;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        /* Top Speaker Earpiece */
        .speaker {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: #27272a;
            border-radius: 4px;
            z-index: 20;
        }
        /* Inner Screen Area */
        .screen {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 38px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid #000000;
        }
        /* Android Status Bar */
        .status-bar {
            height: 34px;
            background: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            position: relative;
            z-index: 15;
            user-select: none;
            flex-shrink: 0;
        }
        /* Center Camera Punch Hole */
        .camera-punch {
            position: absolute;
            top: 9px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background: #000000;
            border: 2px solid #27272a;
            border-radius: 50%;
            z-index: 25;
        }
        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }
        /* Iframe Website Display */
        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #ffffff;
        }
        /* Android Bottom Navigation Pill Bar */
        .nav-bar {
            height: 20px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-top: 1px solid #f1f5f9;
        }
        .nav-pill {
            width: 90px;
            height: 4px;
            background: #000000;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="android-phone">
        <div class="speaker"></div>
        <div class="camera-punch"></div>
        
        <div class="screen">
            <!-- Android System Status Bar -->
            <div class="status-bar">
                <span>12:30</span>
                <div class="status-icons">
                    <span>5G</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/>
                    </svg>
                    <span>100%</span>
                </div>
            </div>

            <!-- Page Frame -->
            <iframe id="page-frame" src="/" title="Mobile Preview"></iframe>

            <!-- Android Bottom Gesture Bar -->
            <div class="nav-bar">
                <div class="nav-pill"></div>
            </div>
        </div>
    </div>

    <script>
        // Ambil parameter ?page= dari URL
        const params = new URLSearchParams(window.location.search);
        const targetPage = params.get('page') || '/';
        const frame = document.getElementById('page-frame');
        frame.src = targetPage;
    </script>
</body>
</html>
